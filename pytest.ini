[pytest]
# Already Here Command OS — pytest configuration
# Matches pyproject.toml [tool.pytest.ini_options] for local/CI consistency

testpaths = backend/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --no-header
    -q

markers =
    unit: pure unit tests — no network, no DB
    integration: in-process TestClient tests — fast
    e2e: Playwright browser tests against live server — slow
    regression: smoke regression contracts
    slow: tests that take > 30 seconds
    timeout: mark a test with a custom timeout

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
