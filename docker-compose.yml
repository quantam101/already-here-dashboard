# Already Here Command OS - Docker Compose
# Zero-cost deployment for Oracle Cloud Always Free
version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: command-os-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    networks:
      - command-os-net
    # Bind to localhost only - never expose to internet
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: command-os-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-command_os_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_API_KEY: ${LLM_API_KEY:-${EMERGENT_LLM_KEY:-}}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      AUTONOMY_LEVEL: ${AUTONOMY_LEVEL:-L3}
      DUAL_ACTOR_APPROVAL: ${DUAL_ACTOR_APPROVAL:-false}
      BW_SESSION: ${BW_SESSION:-}
      SYSTEM_MODE: production
      COST_GUARD_ENABLED: "true"
      ZERO_SPEND_MODE: "true"
      AUTO_CYCLE_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - command-os-net
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./governance.yaml:/app/governance.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: command-os-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - command-os-net
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: command-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - command-os-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── ASI Engine (Asynchronous Stochastic Integration) ─────────────────────────
  asi-engine:
    image: python:3.11-slim
    container_name: asi_engine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install google-genai && python agents/asi_engine.py"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLUSTER_SECRET=${CLUSTER_SECRET}
      - REDIS_ENDPOINT=redis://asi-cache:6379
      - ASI_AUTO_DEPLOY=${ASI_AUTO_DEPLOY:-false}
    volumes:
      - .:/app
    depends_on:
      - asi-cache
    networks:
      - command-os-net

  asi-cache:
    image: redis:7-alpine
    container_name: asi_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - asi_redis_data:/data
    networks:
      - command-os-net

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  command-os-net:
    driver: bridge
