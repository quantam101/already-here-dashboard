name: Sovereign 24/7 Cycle

on:
  schedule:
    # Hourly sovereign decision cycle (GitHub Actions as external heartbeat)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force_agent:
        description: "Optional: force a specific agent (e.g. content-agent)"
        required: false
        default: ""

concurrency:
  group: sovereign-cycle
  cancel-in-progress: false   # never cancel mid-run — let it finish

jobs:
  sovereign-trigger:
    name: Trigger Sovereign Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping sovereign /trigger endpoint
        run: |
          BASE_URL="${{ secrets.CMDOS_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            echo "CMDOS_BASE_URL not set — trying default alreadyherellc.com"
            BASE_URL="https://app.alreadyherellc.com"
          fi
          echo "Triggering sovereign at $BASE_URL/api/sovereign/trigger"
          HTTP_STATUS=$(curl -s -o /tmp/sov_response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "$BASE_URL/api/sovereign/trigger" || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/sov_response.json 2>/dev/null | python3 -m json.tool 2>/dev/null || cat /tmp/sov_response.json 2>/dev/null || true
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "::warning::Sovereign endpoint unreachable — server may be down"
          elif [ "$HTTP_STATUS" -ge 500 ] 2>/dev/null; then
            echo "::warning::Sovereign trigger returned $HTTP_STATUS — server error, non-blocking"
          else
            echo "Sovereign cycle triggered (HTTP $HTTP_STATUS)."
          fi

      - name: Health gate (informational)
        if: always()
        run: |
          BASE_URL="${{ secrets.CMDOS_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://app.alreadyherellc.com"
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE_URL/api/health/" 2>/dev/null || echo "000")
          echo "Post-cycle health: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Health check returned $HTTP after sovereign cycle"
          fi
