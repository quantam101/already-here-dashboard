# Already Here Command OS — Lightweight 1GB-RAM Variant
# Free-Only Build Directive compliant:
#   - SQLite instead of MongoDB (~500MB RAM savings)
#   - Frontend served as a pre-built static bundle by Caddy (no Node runtime)
#   - Total steady-state memory target: < 700 MB
#
# Use this on the DashboardAlways Free host (VM.Standard.E2.1.Micro, 1 OCPU/1GB).
# For development or larger nodes, use docker-compose.yml (MongoDB) instead.
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: command-os-backend
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: /app/data/command_os.db
      DB_NAME: ${DB_NAME:-command_os}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      KOBOLD_BASE_URL: ${KOBOLD_BASE_URL:-}
      KOBOLD_MODEL: ${KOBOLD_MODEL:-koboldcpp}
      # ── Social Media Credentials ─────────────────────────────────────────
      # Medium (free): medium.com/me/settings/security → Integration token
      MEDIUM_INTEGRATION_TOKEN: ${MEDIUM_INTEGRATION_TOKEN:-}
      # Dev.to (free): dev.to/settings/extensions → API key
      DEVTO_API_KEY: ${DEVTO_API_KEY:-}
      # Reddit (free): reddit.com/prefs/apps → create "script" app
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-entrepreneur,passive_income,sidehustle}
      # Facebook Page (requires Meta Developer App + App Review)
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
      # Instagram (same Meta app as Facebook, needs IG Business account)
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      # Threads (Meta Threads API — separate token from Instagram)
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      # LinkedIn (linkedin.com/developers → create app → w_member_social)
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_PERSON_URN: ${LINKEDIN_PERSON_URN:-}
      # YouTube (Google Cloud Console → YouTube Data API v3 → OAuth2)
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # TikTok (developers.tiktok.com → Content Posting API approval required)
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      # Discourse / Niche Forums (any Discourse-based forum)
      DISCOURSE_BASE_URL: ${DISCOURSE_BASE_URL:-}
      DISCOURSE_API_KEY: ${DISCOURSE_API_KEY:-}
      DISCOURSE_API_USERNAME: ${DISCOURSE_API_USERNAME:-}
      DISCOURSE_CATEGORY_ID: ${DISCOURSE_CATEGORY_ID:-1}
      # Content Repo (GitHub Pages auto-publish)
      CONTENT_REPO_TOKEN: ${CONTENT_REPO_TOKEN:-}
      GITHUB_CONTENT_OWNER: ${GITHUB_CONTENT_OWNER:-quantam101}
      GITHUB_CONTENT_REPO: ${GITHUB_CONTENT_REPO:-content}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_emergent}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      BW_SESSION: ${BW_SESSION:-}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-}   # optional - profitengine-server for heavy jobs
      SYSTEM_MODE: production
      COST_GUARD_ENABLED: "true"
      ZERO_SPEND_MODE: "true"
      AUTO_CYCLE_ENABLED: "true"
      # Memory-conservative uvicorn settings (1 worker, no reload)
      MONGO_URL: unused   # kept only so legacy code reading os.environ['MONGO_URL'] doesn't crash; SQLite path is taken
    networks:
      - command-os-net
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - sqlite_data:/app/data
      - ./exports:/app/exports
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    # Caddy serves the pre-built frontend static bundle directly + reverse-proxies /api → backend
    image: caddy:2-alpine
    container_name: command-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.sqlite:/etc/caddy/Caddyfile:ro
      - ./frontend/build:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - command-os-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:

networks:
  command-os-net:
    driver: bridge
