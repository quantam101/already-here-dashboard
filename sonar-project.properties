# SonarCloud / SonarQube exclusions
# Disables the rules that keep producing false positives on this codebase.
sonar.projectKey=already-here-command-os

# Block the noisy paths
sonar.exclusions=**/node_modules/**,**/__pycache__/**,frontend/build/**,data/**

# Rule-level suppressions:
#   python:S5443 — "Avoid exec()" — we use asyncio.create_subprocess_exec
#   python:S6395 — too-complex / too-long function
#   python:S1481 — possibly-unused variable (Pydantic field assignment FP)
#   javascript:S6440 — react-hooks/exhaustive-deps (fire-once []-deps)
#   javascript:S2068 — hardcoded credentials (FP on test placeholders)
#   javascript:S5852 — localStorage usage (only stores wizard-seen flag)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S6395
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1481
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6440
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S5852
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
