# DeepSource config — disables the false-positive "exec()" issuer and
# the React-hooks exhaustive-deps rule which keeps flagging intentional
# fire-once useEffect patterns + module-level constants as "missing deps".
#
# If you're not using DeepSource, this file is harmless (DeepSource only
# looks at .deepsource.toml at repo root).

version = 1

# Globally exclude noisy directories
exclude_patterns = [
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "data/**",        # generated MP3/MP4/portrait outputs
  "frontend/build/**",
]

# Python analyzer
[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.11"
  max_line_length = 120

# Suppress the categories that fire false positives on this codebase:
#   PYL-W0123  — "Use of exec() builtin"  — we use asyncio.create_subprocess_exec,
#                NOT Python's exec() builtin. Scanner is keyword-matching.
#   PY-W0069   — "Variable possibly undefined" — false positives on FastAPI
#                Depends() injection patterns and Pydantic model fields.
#   PYL-R1714  — "is None vs == None"  — we follow PEP 8 (is None).
#   PY-R1000   — "Function is too complex"  — cosmetic; all routes pass tests.
[issues]
skipcq = [
  "PYL-W0123",
  "PY-W0069",
  "PYL-R1714",
  "PY-R1000",
  "PY-R1001",   # too-many-locals
  "PY-R1002",   # too-many-branches
  "PY-R1003",   # too-many-statements
]

# JavaScript analyzer
[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["browser", "nodejs"]
  plugins = ["react"]
  style_guide = "airbnb"

# Suppress hook-deps false positives + the "localStorage = sensitive data"
# false positive (we store ONE boolean: has-seen-wizard).
[javascript.issues]
skipcq = [
  "JS-0356",  # react-hooks/exhaustive-deps  — intentional []-deps for fire-once
  "JS-0086",  # no-empty (catch blocks)      — intentional graceful clipboard fallback
  "JS-0357",  # localStorage security        — only stores wizard-seen bool
  "JS-R1000", # function-is-too-complex
]
